<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ליגת באולינג — DEMO</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #EFF9FF; color: #0C4A6E; direction: rtl; min-height: 100vh; }

header {
  background: linear-gradient(135deg, #0369A1 0%, #083D5C 100%);
  color: #fff; padding: 22px 20px;
  box-shadow: 0 4px 20px rgba(8,61,92,0.2);
}
.header-inner { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; text-align: right; }
header .brand {
  font-size: 88px; width: 128px; height: 128px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
header .brand img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
header h1 { font-size: 24px; font-weight: 800; }
header p { font-size: 13px; color: #7DD3FC; margin-top: 4px; }

.wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }

.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab {
  padding: 10px 18px; border-radius: 10px; cursor: pointer;
  background: #fff; border: 1.5px solid #BAE6FD; color: #0369A1;
  font-size: 14px; font-weight: 700; transition: all .15s;
}
.tab:hover { background: #E0F2FE; }
.tab.active { background: linear-gradient(135deg, #0EA5E9, #0284C7); color: #fff; border-color: transparent; }

.section { display: none; }
.section.active { display: block; }

.card {
  background: #fff; border-radius: 16px; border: 1px solid #BAE6FD;
  padding: 22px; box-shadow: 0 2px 14px rgba(14,165,233,0.08); margin-bottom: 18px;
}
.card h2 { font-size: 16px; margin-bottom: 14px; color: #0C4A6E; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th {
  background: #F0F9FF; text-align: right; padding: 10px 12px; font-size: 13px;
  font-weight: 700; color: #0369A1; border-bottom: 2px solid #BAE6FD; white-space: nowrap;
}
td { padding: 10px 12px; font-size: 14px; border-bottom: 1px solid #E0F2FE; color: #0C4A6E; white-space: nowrap; }
tr:last-child td { border-bottom: none; }

.color-dot { display:inline-block; width:11px; height:11px; border-radius:50%; margin-left:8px; vertical-align:middle; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; background: #E0F2FE; color: #0369A1; }
.rank-1 td:first-child { color: #D97706; font-weight: 900; }
.rank-2 td:first-child { color: #64748B; font-weight: 900; }
.rank-3 td:first-child { color: #B45309; font-weight: 900; }

.empty-state { text-align: center; padding: 40px 20px; color: #7DD3FC; }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 10px; }

.loading, .config-msg {
  text-align: center; padding: 60px 20px; color: #0369A1; font-size: 14px;
}
.config-msg { color: #B91C1C; max-width: 480px; margin: 40px auto; background: #fff; border-radius: 16px; border: 1px solid #FECACA; padding: 28px; }

footer { text-align: center; padding: 20px; color: #7DD3FC; font-size: 12px; }

@media (max-width: 600px) {
  header h1 { font-size: 20px; }
  .tab { flex: 1; text-align: center; padding: 10px 8px; font-size: 13px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand" id="league-logo">&#x1F3B3;</div>
    <div>
      <h1 id="league-name">ליגת באולינג (DEMO)</h1>
      <p>טבלת דירוג, לוח משחקים ותוצאות — עדכני בזמן אמת</p>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="content">
    <div class="loading">&#x23F3; טוען נתונים...</div>
  </div>
</div>

<footer>ליגת באולינג &copy; <span id="footer-year"></span> · תצוגה ציבורית לצפייה בלבד</footer>

<script>
// ─── CONFIGURE YOUR FIREBASE PROJECT HERE ───────────────────────
// Use the exact same Firebase Config you pasted into admin.html's
// setup screen (Firebase console → Project settings → Your apps).
// This page only *reads* data (Firestore rules restrict writes to
// authenticated admin devices), so it's safe to keep this public.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBTZDp2AWS7k0Pg-jzTVHVdUi0RgWVquso",
  authDomain: "bowling-league-demo.firebaseapp.com",
  projectId: "bowling-league-demo",
  storageBucket: "bowling-league-demo.firebasestorage.app",
  messagingSenderId: "128811185669",
  appId: "1:128811185669:web:a0c3c9c27d7905efc9ce6c"
};

function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('he-IL');
}

function loadFirebaseSDK() {
  return new Promise(resolve => {
    const timer = setTimeout(() => resolve(false), 8000);
    function load(src, next) {
      const s = document.createElement('script');
      s.src = src;
      s.onerror = () => { clearTimeout(timer); resolve(false); };
      s.onload = next;
      document.head.appendChild(s);
    }
    load('https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js', () =>
      load('https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js', () => {
        clearTimeout(timer); resolve(true);
      })
    );
  });
}

// Operative per-game team total (handicap-inclusive when the league has
// handicap enabled; equal to the raw total otherwise). Falls back to the
// legacy `teamATotal`/`teamBTotal` field for results saved before handicap
// support existed.
function gameTotal(g, side) {
  return g[`team${side}HcpTotal`] ?? g[`team${side}Total`] ?? 0;
}

// Alternative scoring: every team in a round (same date) is compared
// against every OTHER team that played that date, not just its own
// scheduled pairing — 1 point per game beaten (0.5 on a tie), 1 more for
// the higher series total, plus the same high-score bonus. Mirrors the
// admin app's computeRoundRobinTeamPoints().
function computeRoundRobinTeamPoints(DB) {
  // Same per-win point values as the standard method (Settings → כללי
  // ניקוד), just applied against every other team in the round instead of
  // one scheduled opponent — so beating all N-1 other teams in a game earns
  // (N-1) × pointsPerGameWin, and likewise for the series with its own
  // (usually higher) weight.
  const gw = DB.settings.pointsPerGameWin ?? 1;
  const sw = DB.settings.pointsPerSeriesWin ?? 2;
  const byDate = {};
  DB.results.forEach(r => {
    if (!byDate[r.date]) byDate[r.date] = [];
    byDate[r.date].push(r);
  });
  const teamPoints = {};
  DB.teams.forEach(t => { teamPoints[t.id] = 0; });
  Object.values(byDate).forEach(roundResults => {
    const roundTeams = {};
    roundResults.forEach(r => {
      const aGames = (r.games || []).map(g => gameTotal(g, 'A'));
      const bGames = (r.games || []).map(g => gameTotal(g, 'B'));
      const aBonus = (r.games || []).reduce((s, g) => s + (g.teamABonus || 0), 0);
      const bBonus = (r.games || []).reduce((s, g) => s + (g.teamBBonus || 0), 0);
      roundTeams[r.teamAId] = { games: aGames, series: aGames.reduce((s, v) => s + v, 0), bonus: aBonus, forfeit: !!r.teamAForfeit };
      roundTeams[r.teamBId] = { games: bGames, series: bGames.reduce((s, v) => s + v, 0), bonus: bBonus, forfeit: !!r.teamBForfeit };
    });
    const teamIds = Object.keys(roundTeams);
    teamIds.forEach(teamId => {
      const me = roundTeams[teamId];
      if (me.forfeit) return;
      let pts = 0;
      teamIds.forEach(otherId => {
        if (otherId === teamId) return;
        const other = roundTeams[otherId];
        me.games.forEach((g, i) => {
          const og = other.games[i] ?? 0;
          if (g > og) pts += gw; else if (g === og) pts += gw / 2;
        });
        if (me.series > other.series) pts += sw;
        else if (me.series === other.series) pts += sw / 2;
      });
      teamPoints[teamId] = (teamPoints[teamId] || 0) + pts + me.bonus;
    });
  });
  return teamPoints;
}

// Set inside renderContent() each render — lets the round <select> in the
// "תוצאות אחרונות" tab re-render just its cards on change, without a full
// page re-render or a module-level copy of DB.
let renderResultsForDate = null;

function renderContent(DB) {
  const el = document.getElementById('content');

  // Team standings
  const altPoints = DB.settings && DB.settings.scoringMethod === 'roundRobin' ? computeRoundRobinTeamPoints(DB) : null;
  const teamMap = {};
  DB.teams.forEach(t => { teamMap[t.id] = { team: t, played: 0, points: 0, pins: 0 }; });
  DB.results.forEach(r => {
    const a = teamMap[r.teamAId], b = teamMap[r.teamBId];
    const aPins = (r.games || []).reduce((s, g) => s + gameTotal(g, 'A'), 0);
    const bPins = (r.games || []).reduce((s, g) => s + gameTotal(g, 'B'), 0);
    if (a) { a.played++; a.pins += aPins; if (!altPoints) a.points += r.teamAPoints || 0; }
    if (b) { b.played++; b.pins += bPins; if (!altPoints) b.points += r.teamBPoints || 0; }
  });
  if (altPoints) { Object.keys(teamMap).forEach(tid => { teamMap[tid].points = altPoints[tid] || 0; }); }
  const teamStandings = Object.values(teamMap).sort((x, y) => y.points - x.points || y.pins - x.pins);

  // Player standings
  const playerStats = {};
  DB.players.forEach(p => { playerStats[p.id] = { player: p, games: 0, total: 0, high: 0 }; });
  DB.results.forEach(r => (r.games || []).forEach(g => {
    Object.entries(g.playerScores || {}).forEach(([pid, score]) => {
      if (!playerStats[pid] || score == null) return;
      playerStats[pid].games++;
      playerStats[pid].total += score;
      if (score > playerStats[pid].high) playerStats[pid].high = score;
    });
  }));
  const playerStandings = Object.values(playerStats)
    .filter(s => s.games > 0)
    .map(s => ({ ...s, avg: s.total / s.games }))
    .sort((a, b) => b.avg - a.avg || b.games - a.games);

  const teamName = id => (DB.teams.find(t => t.id === id) || {}).name || '—';
  const teamColor = id => (DB.teams.find(t => t.id === id) || {}).color || '#94A3B8';
  const playerName = pid => (DB.players.find(p => p.id === pid) || {}).name || '—';
  const playerTeamId = pid => (DB.players.find(p => p.id === pid) || {}).teamId || '';
  const rankClass = i => i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
  const teamCell = pid => playerTeamId(pid) ? `<span class="color-dot" style="background:${teamColor(playerTeamId(pid))}"></span>${teamName(playerTeamId(pid))}` : '—';

  // Round all-stars: top 5 individual series totals from the most recent match date
  const latestDate = DB.results.length ? DB.results.reduce((max, r) => (r.date > max ? r.date : max), DB.results[0].date) : null;
  const roundEntries = [];
  if (latestDate) {
    DB.results.filter(r => r.date === latestDate).forEach(r => {
      const pids = new Set();
      (r.games || []).forEach(g => Object.keys(g.playerScores || {}).forEach(pid => pids.add(pid)));
      pids.forEach(pid => {
        const total = (r.games || []).reduce((s, g) => s + ((g.playerScores && g.playerScores[pid]) || 0), 0);
        roundEntries.push({ pid, total });
      });
    });
  }
  const roundAllStars = roundEntries.sort((a, b) => b.total - a.total).slice(0, 5);
  const lastRoundResults = latestDate ? DB.results.filter(r => r.date === latestDate) : [];

  // All-time single-game high scores (top 3)
  const singleGameEntries = [];
  DB.results.forEach(r => (r.games || []).forEach(g => {
    Object.entries(g.playerScores || {}).forEach(([pid, score]) => {
      if (score != null) singleGameEntries.push({ pid, score, date: r.date });
    });
  }));
  const topSingleGames = singleGameEntries.sort((a, b) => b.score - a.score).slice(0, 3);

  // All-time series high (top 3)
  const seriesEntries = [];
  DB.results.forEach(r => {
    const pids = new Set();
    (r.games || []).forEach(g => Object.keys(g.playerScores || {}).forEach(pid => pids.add(pid)));
    pids.forEach(pid => {
      const total = (r.games || []).reduce((s, g) => s + ((g.playerScores && g.playerScores[pid]) || 0), 0);
      seriesEntries.push({ pid, total, date: r.date, gamesCount: (r.games || []).length });
    });
  });
  const topSeries = seriesEntries.sort((a, b) => b.total - a.total).slice(0, 3);

  // All-time team series high (top 3) — same handicap-inclusive totals used in team standings
  const teamSeriesEntries = [];
  DB.results.forEach(r => {
    const aTotal = (r.games || []).reduce((s, g) => s + gameTotal(g, 'A'), 0);
    const bTotal = (r.games || []).reduce((s, g) => s + gameTotal(g, 'B'), 0);
    teamSeriesEntries.push({ teamId: r.teamAId, total: aTotal, date: r.date });
    teamSeriesEntries.push({ teamId: r.teamBId, total: bTotal, date: r.date });
  });
  const topTeamSeries = teamSeriesEntries.sort((a, b) => b.total - a.total).slice(0, 3);

  // Women-only personal records — only shown once there are at least 2
  // registered female players, so the tables aren't a near-empty ranking.
  const playerGender = pid => (DB.players.find(p => p.id === pid) || {}).gender || '';
  const womenCount = DB.players.filter(p => p.gender === 'אישה').length;
  const topSingleGamesWomen = singleGameEntries.filter(e => playerGender(e.pid) === 'אישה').sort((a, b) => b.score - a.score).slice(0, 3);
  const topSeriesWomen = seriesEntries.filter(e => playerGender(e.pid) === 'אישה').sort((a, b) => b.total - a.total).slice(0, 3);

  const upcoming = DB.schedule.filter(s => s.status !== 'completed').sort((a, b) => (a.date || '').localeCompare(b.date || ''));

  // Round selector for the "תוצאות אחרונות" tab — defaults to the latest
  // played round, but any round with saved results can be picked.
  const resultRoundDates = [...new Set(DB.results.map(r => r.date))].sort().reverse();

  function buildResultCardsHtml(dateStr) {
    const results = dateStr ? DB.results.filter(r => r.date === dateStr) : [];
    return results.length ? results.map(r => {
      const aPins = (r.games || []).reduce((s, g) => s + gameTotal(g, 'A'), 0);
      const bPins = (r.games || []).reduce((s, g) => s + gameTotal(g, 'B'), 0);
      const aPlayers = DB.players.filter(p => p.teamId === r.teamAId);
      const bPlayers = DB.players.filter(p => p.teamId === r.teamBId);
      const gamesCount = (r.games || []).length;
      const gamesHeader = Array.from({ length: gamesCount }, (_, i) => `<th>משחק ${i + 1}</th>`).join('');
      function playerRows(players) {
        return players.map(p => {
          const cells = (r.games || []).map(g => `<td style="text-align:center;">${g.playerScores && g.playerScores[p.id] != null ? g.playerScores[p.id] : '—'}</td>`).join('');
          const total = (r.games || []).reduce((s, g) => s + ((g.playerScores && g.playerScores[p.id]) || 0), 0);
          return `<tr><td>${p.name}</td>${cells}<td style="font-weight:800;">${total}</td></tr>`;
        }).join('') || `<tr><td colspan="${gamesCount + 2}" style="text-align:center;color:#94A3B8;">אין שחקנים</td></tr>`;
      }
      return `
        <div class="card">
          <h2>${teamName(r.teamAId)} נגד ${teamName(r.teamBId)} — ${fmtDate(r.date)}</h2>
          <p style="font-size:13px; color:#0369A1; margin-bottom:14px;">פינים: <strong>${aPins} : ${bPins}</strong> &nbsp;·&nbsp; נקודות ליגה: <strong>${r.teamAPoints} : ${r.teamBPoints}</strong></p>
          <h3 style="font-size:14px; margin-bottom:8px; color:#0C4A6E;"><span class="color-dot" style="background:${teamColor(r.teamAId)}"></span>${teamName(r.teamAId)}</h3>
          <div class="table-wrap"><table>
            <thead><tr><th>שחקן</th>${gamesHeader}<th>סה"כ</th></tr></thead>
            <tbody>${playerRows(aPlayers)}</tbody>
          </table></div>
          <h3 style="font-size:14px; margin:16px 0 8px; color:#0C4A6E;"><span class="color-dot" style="background:${teamColor(r.teamBId)}"></span>${teamName(r.teamBId)}</h3>
          <div class="table-wrap"><table>
            <thead><tr><th>שחקן</th>${gamesHeader}<th>סה"כ</th></tr></thead>
            <tbody>${playerRows(bPlayers)}</tbody>
          </table></div>
        </div>`;
    }).join('') : `<div class="card"><p style="text-align:center;color:#94A3B8;">אין תוצאות עדיין</p></div>`;
  }
  renderResultsForDate = buildResultCardsHtml;

  el.innerHTML = `
    <div class="tabs">
      <div class="tab active" data-tab="standings" onclick="switchTab('standings')">&#x1F3C6; דירוג</div>
      <div class="tab" data-tab="schedule" onclick="switchTab('schedule')">&#x1F4C5; משחקים קרובים</div>
      <div class="tab" data-tab="results" onclick="switchTab('results')">&#x1F3AF; תוצאות אחרונות</div>
    </div>

    <div class="section active" id="section-standings">
      <div class="card">
        <h2>דירוג קבוצתי</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>#</th><th>קבוצה</th><th>שיחקו</th><th>נק׳ ליגה</th><th>סה"כ פינים</th></tr></thead>
          <tbody>
            ${teamStandings.length ? teamStandings.map((s, i) => `
              <tr class="${i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : ''}">
                <td>${i + 1}</td>
                <td><span class="color-dot" style="background:${s.team.color || '#94A3B8'}"></span>${s.team.name}</td>
                <td>${s.played}</td>
                <td><strong>${s.points}</strong></td>
                <td>${s.pins}</td>
              </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:#94A3B8;">אין נתונים עדיין</td></tr>`}
          </tbody>
        </table></div>
      </div>
      <div class="card">
        <h2>דירוג אישי</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>#</th><th>שחקן</th><th>קבוצה</th><th>משחקים</th><th>ממוצע</th><th>ציון גבוה</th></tr></thead>
          <tbody>
            ${playerStandings.length ? playerStandings.map((s, i) => `
              <tr class="${i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : ''}">
                <td>${i + 1}</td>
                <td>${s.player.name}</td>
                <td>${s.player.teamId ? `<span class="color-dot" style="background:${teamColor(s.player.teamId)}"></span>${teamName(s.player.teamId)}` : '—'}</td>
                <td>${s.games}</td>
                <td><strong>${s.avg.toFixed(1)}</strong></td>
                <td>${s.high}</td>
              </tr>`).join('') : `<tr><td colspan="6" style="text-align:center;color:#94A3B8;">אין נתונים עדיין</td></tr>`}
          </tbody>
        </table></div>
      </div>
      <div class="card">
        <h2>&#x2B50; נבחרת המחזור${latestDate ? ' — ' + fmtDate(latestDate) : ''}</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>#</th><th>שחקן</th><th>קבוצה</th><th>ניקוד סדרה</th></tr></thead>
          <tbody>
            ${roundAllStars.length ? roundAllStars.map((e, i) => `
              <tr class="${rankClass(i)}">
                <td>${i + 1}</td>
                <td>${playerName(e.pid)}</td>
                <td>${teamCell(e.pid)}</td>
                <td><strong>${e.total}</strong></td>
              </tr>`).join('') : `<tr><td colspan="4" style="text-align:center;color:#94A3B8;">אין נתונים עדיין</td></tr>`}
          </tbody>
        </table></div>
      </div>
      <div class="card">
        <h2>&#x1F4CB; כל המשחקים מהמחזור האחרון${latestDate ? ' — ' + fmtDate(latestDate) : ''}</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>קבוצה א׳</th><th>קבוצה ב׳</th><th>פינים</th><th>נקודות</th></tr></thead>
          <tbody>
            ${lastRoundResults.length ? lastRoundResults.map(r => {
              const aPins = (r.games || []).reduce((s, g) => s + gameTotal(g, 'A'), 0);
              const bPins = (r.games || []).reduce((s, g) => s + gameTotal(g, 'B'), 0);
              return `<tr>
                <td><span class="color-dot" style="background:${teamColor(r.teamAId)}"></span>${teamName(r.teamAId)}</td>
                <td><span class="color-dot" style="background:${teamColor(r.teamBId)}"></span>${teamName(r.teamBId)}</td>
                <td>${aPins} : ${bPins}</td>
                <td><span class="badge">${r.teamAPoints} : ${r.teamBPoints}</span></td>
              </tr>`;
            }).join('') : `<tr><td colspan="4" style="text-align:center;color:#94A3B8;">אין נתונים עדיין</td></tr>`}
          </tbody>
        </table></div>
      </div>
      <div class="card">
        <h2>&#x1F3AF; שיא אישי למשחק בודד</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>#</th><th>שחקן</th><th>קבוצה</th><th>ציון</th><th>תאריך</th></tr></thead>
          <tbody>
            ${topSingleGames.length ? topSingleGames.map((e, i) => `
              <tr class="${rankClass(i)}">
                <td>${i + 1}</td>
                <td>${playerName(e.pid)}</td>
                <td>${teamCell(e.pid)}</td>
                <td><strong>${e.score}</strong></td>
                <td>${fmtDate(e.date)}</td>
              </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:#94A3B8;">אין נתונים עדיין</td></tr>`}
          </tbody>
        </table></div>
      </div>
      <div class="card">
        <h2>&#x1F3C6; שיא אישי לסדרה</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>#</th><th>שחקן</th><th>קבוצה</th><th>ציון סדרה</th><th>תאריך</th></tr></thead>
          <tbody>
            ${topSeries.length ? topSeries.map((e, i) => `
              <tr class="${rankClass(i)}">
                <td>${i + 1}</td>
                <td>${playerName(e.pid)}</td>
                <td>${teamCell(e.pid)}</td>
                <td><strong>${e.total}</strong> <span style="font-size:11px;color:#94A3B8;">(${e.gamesCount} משחקים)</span></td>
                <td>${fmtDate(e.date)}</td>
              </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:#94A3B8;">אין נתונים עדיין</td></tr>`}
          </tbody>
        </table></div>
      </div>
      <div class="card">
        <h2>&#x1F3C5; שיא קבוצתי לסדרה</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>#</th><th>קבוצה</th><th>סה"כ פינים</th><th>תאריך</th></tr></thead>
          <tbody>
            ${topTeamSeries.length ? topTeamSeries.map((e, i) => `
              <tr class="${rankClass(i)}">
                <td>${i + 1}</td>
                <td><span class="color-dot" style="background:${teamColor(e.teamId)}"></span>${teamName(e.teamId)}</td>
                <td><strong>${e.total}</strong></td>
                <td>${fmtDate(e.date)}</td>
              </tr>`).join('') : `<tr><td colspan="4" style="text-align:center;color:#94A3B8;">אין נתונים עדיין</td></tr>`}
          </tbody>
        </table></div>
      </div>
      ${womenCount >= 2 ? `
      <div class="card">
        <h2>&#x1F3AF; שיא אישי למשחק בודד — נשים</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>#</th><th>שחקנית</th><th>קבוצה</th><th>ציון</th><th>תאריך</th></tr></thead>
          <tbody>
            ${topSingleGamesWomen.length ? topSingleGamesWomen.map((e, i) => `
              <tr class="${rankClass(i)}">
                <td>${i + 1}</td>
                <td>${playerName(e.pid)}</td>
                <td>${teamCell(e.pid)}</td>
                <td><strong>${e.score}</strong></td>
                <td>${fmtDate(e.date)}</td>
              </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:#94A3B8;">אין נתונים עדיין</td></tr>`}
          </tbody>
        </table></div>
      </div>
      <div class="card">
        <h2>&#x1F3C6; שיא אישי לסדרה — נשים</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>#</th><th>שחקנית</th><th>קבוצה</th><th>ציון סדרה</th><th>תאריך</th></tr></thead>
          <tbody>
            ${topSeriesWomen.length ? topSeriesWomen.map((e, i) => `
              <tr class="${rankClass(i)}">
                <td>${i + 1}</td>
                <td>${playerName(e.pid)}</td>
                <td>${teamCell(e.pid)}</td>
                <td><strong>${e.total}</strong> <span style="font-size:11px;color:#94A3B8;">(${e.gamesCount} משחקים)</span></td>
                <td>${fmtDate(e.date)}</td>
              </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:#94A3B8;">אין נתונים עדיין</td></tr>`}
          </tbody>
        </table></div>
      </div>` : ''}
    </div>

    <div class="section" id="section-schedule">
      <div class="card">
        <h2>משחקים קרובים</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>תאריך</th><th>שעה</th><th>מסלול</th><th>מחזור</th><th>קבוצה א׳</th><th>קבוצה ב׳</th></tr></thead>
          <tbody>
            ${upcoming.length ? upcoming.map(s => `
              <tr>
                <td>${fmtDate(s.date)}</td>
                <td>${s.time || '—'}</td>
                <td>${s.lane || '—'}</td>
                <td>${s.round || '—'}</td>
                <td>${teamName(s.teamAId)}</td>
                <td>${teamName(s.teamBId)}</td>
              </tr>`).join('') : `<tr><td colspan="6" style="text-align:center;color:#94A3B8;">אין משחקים מתוכננים</td></tr>`}
          </tbody>
        </table></div>
      </div>
    </div>

    <div class="section" id="section-results">
      ${resultRoundDates.length ? `
      <div class="card" style="margin-bottom:20px;">
        <label style="font-size:13px; font-weight:600; color:#0C4A6E;">בחר מחזור:</label>
        <select id="results-round-select" onchange="switchResultsRound(this.value)" style="margin-right:8px; padding:6px 10px; border-radius:8px; border:1px solid #CBD5E1; font-family:inherit; font-size:14px;">
          ${resultRoundDates.map(d => `<option value="${d}" ${d === resultRoundDates[0] ? 'selected' : ''}>${fmtDate(d)}</option>`).join('')}
        </select>
      </div>` : ''}
      <div id="results-cards">${buildResultCardsHtml(resultRoundDates[0] || null)}</div>
    </div>
  `;
}

function switchResultsRound(dateStr) {
  const wrap = document.getElementById('results-cards');
  if (wrap && renderResultsForDate) wrap.innerHTML = renderResultsForDate(dateStr);
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'section-' + name));
}

async function boot() {
  document.getElementById('footer-year').textContent = new Date().getFullYear();

  if (!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId) {
    document.getElementById('content').innerHTML = `
      <div class="config-msg">
        &#x26A0;&#xFE0F; העמוד עדיין לא מחובר לנתוני הליגה.<br><br>
        יש להשלים את אובייקט <code>FIREBASE_CONFIG</code> בקובץ <code>index.html</code>
        עם אותם הפרטים שהוזנו בעמוד הניהול (admin.html).
      </div>`;
    return;
  }

  const sdkLoaded = await loadFirebaseSDK();
  if (!sdkLoaded) {
    document.getElementById('content').innerHTML = `<div class="config-msg">&#x26A0;&#xFE0F; לא ניתן היה לטעון את נתוני הליגה — בדוק חיבור לאינטרנט ונסה לרענן.</div>`;
    return;
  }

  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const fdb = firebase.firestore();
    const [t, p, s, r, cfg] = await Promise.all([
      fdb.collection('teams').get(),
      fdb.collection('players').get(),
      fdb.collection('schedule').get(),
      fdb.collection('results').get(),
      fdb.collection('settings').doc('config').get()
    ]);
    const settings = cfg.exists ? cfg.data() : {};
    if (cfg.exists) {
      if (settings.leagueName) {
        document.getElementById('league-name').textContent = settings.leagueName + ' (DEMO)';
        document.title = settings.leagueName + ' — DEMO';
      }
      if (settings.logoData) {
        document.getElementById('league-logo').innerHTML = `<img src="${settings.logoData}" alt="">`;
      }
    }
    renderContent({
      teams: t.docs.map(d => d.data()),
      players: p.docs.map(d => d.data()),
      schedule: s.docs.map(d => d.data()),
      results: r.docs.map(d => d.data()),
      settings
    });
  } catch(e) {
    console.warn('Load error:', e.message);
    document.getElementById('content').innerHTML = `<div class="config-msg">&#x26A0;&#xFE0F; שגיאה בטעינת נתוני הליגה. נסה לרענן את הדף מאוחר יותר.</div>`;
  }
}

boot();
</script>
</body>
</html>
